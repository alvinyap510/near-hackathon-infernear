[package]
name = "infernear-rhea-vault"
version = "0.1.0"
edition = "2024"
publish = false

[features]
sandbox-gas = ["dep:near-workspaces", "dep:tokio", "dep:anyhow"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable", "legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing", "unstable", "legacy"] }
proptest = { version = "1.9", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-workspaces = { version = "=0.24.0", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
anyhow = { version = "1", optional = true }
