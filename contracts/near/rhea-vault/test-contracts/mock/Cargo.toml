[package]
name = "infernear-rhea-test-mock"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
