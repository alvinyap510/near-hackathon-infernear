[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "openzeppelin-contracts/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "aave-v3-origin/=node_modules/@aave-dao/aave-v3-origin/src/",
  "aave-address-book/=node_modules/@bgd-labs/aave-address-book/src/",
  "forge-std/=node_modules/forge-std/src/"
]

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[fuzz]
runs = 256
